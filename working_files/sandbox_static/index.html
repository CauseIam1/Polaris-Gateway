<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polaris Sandbox - X17 (LGI) Control</title>
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-tertiary: #1a1a25;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0a0;
            --accent-green: #00ff88;
            --accent-blue: #00ccff;
            --accent-red: #ff4444;
            --border-color: #2a2a35;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Courier New', monospace;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        header {
            background: var(--bg-secondary);
            border-bottom: 2px solid var(--accent-blue);
            padding: 20px;
            margin-bottom: 20px;
        }
        header h1 { color: var(--accent-blue); font-size: 24px; margin-bottom: 5px; }
        .status-bar { display: flex; gap: 20px; margin-top: 10px; font-size: 14px; }
        .status-item { display: flex; align-items: center; gap: 8px; }
        .status-indicator {
            width: 10px; height: 10px; border-radius: 50%;
            animation: pulse 2s infinite;
        }
        .status-indicator.connected { background: var(--accent-green); }
        .status-indicator.disconnected { background: var(--accent-red); }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .panel {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
        }
        .panel h2 { color: var(--accent-green); font-size: 18px; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid var(--border-color); }
        .command-input {
            width: 100%; background: var(--bg-tertiary); border: 1px solid var(--border-color);
            color: var(--text-primary); padding: 12px; font-family: 'Courier New', monospace;
            font-size: 14px; border-radius: 4px; margin-bottom: 10px;
        }
        .command-input:focus { outline: none; border-color: var(--accent-blue); }
        .btn {
            background: var(--accent-blue); color: #000; border: none;
            padding: 10px 20px; font-family: 'Courier New', monospace;
            font-size: 14px; font-weight: bold; border-radius: 4px;
            cursor: pointer; transition: all 0.2s;
        }
        .btn:hover { background: #33ddff; transform: translateY(-2px); }
        .btn-secondary {
            background: var(--bg-tertiary); color: var(--text-primary);
            border: 1px solid var(--border-color);
        }
        .btn-secondary:hover { background: var(--border-color); }
        .output-area {
            background: var(--bg-tertiary); border: 1px solid var(--border-color);
            border-radius: 4px; padding: 15px; min-height: 300px; max-height: 500px;
            overflow-y: auto; font-size: 13px; white-space: pre-wrap; word-break: break-all;
        }
        .output-success { color: var(--accent-green); }
        .output-error { color: var(--accent-red); }
        .output-info { color: var(--text-secondary); }
        .history-list { list-style: none; max-height: 400px; overflow-y: auto; }
        .history-item {
            padding: 10px; margin-bottom: 8px; background: var(--bg-tertiary);
            border-radius: 4px; border-left: 3px solid var(--accent-blue);
            cursor: pointer; transition: all 0.2s;
        }
        .history-item:hover { background: var(--border-color); transform: translateX(5px); }
        .history-item .cmd { font-size: 12px; color: var(--text-primary); margin-bottom: 5px; }
        .history-item .meta { font-size: 11px; color: var(--text-secondary); }
        .history-item.success { border-left-color: var(--accent-green); }
        .history-item.error { border-left-color: var(--accent-red); }
        .quick-actions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 15px; }
        .visualization-panel { grid-column: 1 / -1; min-height: 400px; }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>🔮 Polaris Sandbox Gateway</h1>
            <div class="status-bar">
                <div class="status-item">
                    <div class="status-indicator" id="statusIndicator"></div>
                    <span id="statusText">Checking...</span>
                </div>
                <div class="status-item"><span id="lgiHost">X17 (LGI): --</span></div>
                <div class="status-item"><span id="workdir">WorkDir: --</span></div>
            </div>
        </div>
    </header>
    
    <div class="container">
        <div class="main-grid">
            <div class="panel">
                <h2>⚡ Command Execution</h2>
                <textarea class="command-input" id="commandInput" rows="3" placeholder="Enter SSH command to execute on the X17 (LGI)..."></textarea>
                <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                    <button class="btn" onclick="executeCommand()">Execute</button>
                    <button class="btn btn-secondary" onclick="clearOutput()">Clear</button>
                </div>
                
                <h3 style="color: var(--text-secondary); font-size: 14px; margin-bottom: 10px;">Quick Actions:</h3>
                <div class="quick-actions">
                    <button class="btn btn-secondary" onclick="quickCommand('uptime')">System Status</button>
                    <button class="btn btn-secondary" onclick="quickCommand('ps aux | head -20')">Process List</button>
                    <button class="btn btn-secondary" onclick="quickCommand('df -h')">Disk Usage</button>
                    <button class="btn btn-secondary" onclick="quickCommand('free -h')">Memory Usage</button>
                    <button class="btn btn-secondary" onclick="quickCommand('cd /d D:/LGI && dir')">List WorkDir</button>
                    <button class="btn btn-secondary" onclick="quickCommand('cd /d D:/LGI && git status')">Git Status</button>
                </div>
            </div>
            
            <div class="panel">
                <h2>📊 Command History</h2>
                <ul class="history-list" id="historyList">
                    <li class="output-info">Loading history...</li>
                </ul>
            </div>
            
            <div class="panel visualization-panel">
                <h2>📈 Output & Visualization</h2>
                <div class="output-area" id="outputArea">
                    <div class="output-info">Ready for commands. Execute SSH commands on the X17 (LGI) to see output here...</div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let MINI_PI_HOST = '192.168.50.227';
        
        async function loadStatus() {
            try {
                const response = await fetch('/api/status');
                const status = await response.json();
                MINI_PI_HOST = status.lgi_host;
                document.getElementById('lgiHost').textContent = 'X17 (LGI): ' + status.lgi_host;
                document.getElementById('workdir').textContent = 'WorkDir: ' + status.lgi_workdir;
                
                const statusIndicator = document.getElementById('statusIndicator');
                const statusText = document.getElementById('statusText');
                
                if (status.connected) {
                    statusIndicator.className = 'status-indicator connected';
                    statusText.textContent = 'Connected';
                } else {
                    statusIndicator.className = 'status-indicator disconnected';
                    statusText.textContent = 'Disconnected';
                }
            } catch (error) {
                console.error('Failed to load status:', error);
                document.getElementById('statusText').textContent = 'Error';
            }
        }
        
        async function executeCommand(cmd = null) {
            const command = cmd || document.getElementById('commandInput').value;
            const outputArea = document.getElementById('outputArea');
            
            if (!command.trim()) {
                outputArea.innerHTML = '<div class="output-error">Error: Empty command</div>';
                return;
            }
            
            outputArea.innerHTML = '<div class="output-info">Executing: ' + command + '</div><div class="output-info">...</div>';
            
            try {
                const response = await fetch('/api/ssh/execute', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        target_host: MINI_PI_HOST,
                        command: command,
                        timeout: 30
                    })
                });
                
                const result = await response.json();
                
                let output = '<div class="output-info">=== Command: ' + result.command + ' ===</div>';
                output += '<div class="output-info">Timestamp: ' + result.timestamp + '</div>';
                output += '<div class="output-info">Return Code: ' + result.returncode + '</div><br/>';
                
                if (result.success) {
                    output += '<div class="output-success">✓ Command executed successfully</div><br/>';
                    if (result.stdout) {
                        output += '<div class="output-info">STDOUT:</div>';
                        output += '<div class="output-success">' + escapeHtml(result.stdout) + '</div>';
                    }
                } else {
                    output += '<div class="output-error">✗ Command failed</div><br/>';
                    if (result.error) {
                        output += '<div class="output-info">Error:</div>';
                        output += '<div class="output-error">' + escapeHtml(result.error) + '</div>';
                    }
                    if (result.stderr) {
                        output += '<div class="output-info">STDERR:</div>';
                        output += '<div class="output-error">' + escapeHtml(result.stderr) + '</div>';
                    }
                }
                
                outputArea.innerHTML = output;
                loadHistory();
                
            } catch (error) {
                outputArea.innerHTML = '<div class="output-error">Error: ' + error.message + '</div>';
            }
        }
        
        function quickCommand(cmd) { executeCommand(cmd); }
        function clearOutput() {
            document.getElementById('outputArea').innerHTML = '<div class="output-info">Output cleared. Ready for new commands...</div>';
        }
        
        async function loadHistory() {
            try {
                const response = await fetch('/api/ssh/history');
                const history = await response.json();
                const historyList = document.getElementById('historyList');
                
                if (history.length === 0) {
                    historyList.innerHTML = '<li class="output-info">No commands executed yet</li>';
                    return;
                }
                
                historyList.innerHTML = '';
                history.forEach(cmd => {
                    const li = document.createElement('li');
                    li.className = 'history-item ' + (cmd.success ? 'success' : 'error');
                    li.onclick = () => loadCommand(cmd.command);
                    const cmdShort = cmd.command.substring(0, 80) + (cmd.command.length > 80 ? '...' : '');
                    li.innerHTML = '<div class="cmd">' + cmdShort + '</div>' +
                        '<div class="meta">' + cmd.timestamp + ' • ' + (cmd.success ? '✓' : '✗') + ' (' + cmd.returncode + ')</div>';
                    historyList.appendChild(li);
                });
            } catch (error) {
                console.error('Failed to load history:', error);
                document.getElementById('historyList').innerHTML = '<li class="output-error">Failed to load history</li>';
            }
        }
        
        function loadCommand(cmd) {
            document.getElementById('commandInput').value = cmd;
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Initialize
        loadStatus();
        loadHistory();
        setInterval(loadStatus, 30000);
    </script>
</body>
</html>
